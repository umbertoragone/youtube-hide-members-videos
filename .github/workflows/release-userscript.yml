name: Validate and release userscript

on:
  push:
    branches:
      - main
    paths:
      - hide-members-videos.user.js
      - .github/workflows/release-userscript.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate script and read version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="hide-members-videos.user.js"
          node --check "$SCRIPT"

          VERSION="$(awk '$1 == "//" && $2 == "@version" { print $3; exit }' "$SCRIPT")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing @version in $SCRIPT: '$VERSION'"
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release and attach userscript
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" hide-members-videos.user.js \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
